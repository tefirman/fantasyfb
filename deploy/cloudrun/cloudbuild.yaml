# Builds app/Dockerfile (not a root Dockerfile, so `gcloud run deploy --source`
# can't find it) and pushes the image to Artifact Registry. The image is tagged
# with _TAG (the GitHub Action passes the commit SHA) and also as :latest.
# Run from the repo root: see deploy/cloudrun/README.md.
substitutions:
  _REGION: us-west1
  _REPO: fantasyfb
  _IMAGE: fantasyfb-web
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - app/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
