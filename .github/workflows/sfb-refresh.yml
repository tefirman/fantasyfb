name: SFB refresh

# Rebuilds the Scott Fish Bowl odds page from fresh Sleeper data and publishes
# it to tefirman/sfb-odds (https://taylorfirman.com/sfb-odds/). See
# app/sfb_site/README.md. The league list and saved leaderboard it reads live
# in that repo under inputs/, since they are once-per-season files.

on:
  schedule:
    # 6:17 AM Pacific (PST), 7:17 AM during daylight time. Off the top of the
    # hour because scheduled runs often start late then.
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Injury step only: research and validate, show the proposed diff, commit and publish nothing"
        type: boolean
        default: false
      skip_injuries:
        description: "Skip the injury step (it costs about $0.50 in Claude tokens when there is something to research); ignored by dry runs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sfb-refresh
  cancel-in-progress: false

jobs:
  # The injury step costs Claude tokens, so scheduled runs do it only on Sundays
  # and Wednesdays (Thursday's game and Friday's designations before the lock,
  # then the weekend's injuries once their timelines are out). Manual runs do it
  # unless skip_injuries is checked; run one by hand for news in between.
  plan:
    name: Decide whether to update injuries
    runs-on: ubuntu-latest
    outputs:
      injuries: ${{ steps.decide.outputs.injuries }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP: ${{ inputs.skip_injuries }}
        run: |
          injuries=false
          if [ "$EVENT" = "schedule" ]; then
            case "$(date -u +%a)" in Sun|Wed) injuries=true ;; esac
          elif [ "$DRY_RUN" = "true" ] || [ "$SKIP" != "true" ]; then
            injuries=true
          fi
          echo "injuries=$injuries" >> "$GITHUB_OUTPUT"
          echo "Injury step: $injuries"

  # Updates injured_list.csv in tefirman/fantasy-data before the refresh reads
  # it, using yesterday's saved rosters (the refresh saves them at the end) and
  # today's Sleeper statuses, so it costs no extra Sleeper calls. It never blocks
  # the refresh: continue-on-error lets the refresh run with the list as it is.
  injuries:
    name: Update the injury list
    needs: plan
    if: needs.plan.outputs.injuries == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Fine-grained PAT with Contents: write on tefirman/fantasy-data only.
      - name: Check out the injury list
        uses: actions/checkout@v4
        with:
          repository: tefirman/fantasy-data
          token: ${{ secrets.FANTASY_DATA_PUSH_TOKEN }}
          path: fantasy-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Get today's date
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Sleeper's player list
        uses: actions/cache@v4
        with:
          path: ~/.cache/fantasyfb/sleeper_players.json
          key: sleeper-players-${{ steps.day.outputs.day }}

      # The newest rosters the refresh saved. On the very first run there are
      # none, so the scan is skipped until the refresh has run once.
      - name: Restore the last collected rosters
        id: rosters
        uses: actions/cache/restore@v4
        with:
          path: |
            sfb/data/rosters.parquet
            sfb/data/settings.parquet
          key: sfb-rosters-none
          restore-keys: sfb-rosters-

      - name: Scan for uncovered injuries
        id: scan
        if: steps.rosters.outputs.cache-matched-key != ''
        run: |
          sfb-field injuries sfb/data --injured-list fantasy-data/fantasyfb/injured_list.csv --out-dir scan | tee scan.log
          echo "week=$(python -c "import pandas as pd; print(int(pd.read_parquet('sfb/data/settings.parquet').first_week.min()))")" >> "$GITHUB_OUTPUT"
          if [ "$(wc -l < scan/new_injuries.csv)" -gt 1 ] || [ "$(wc -l < scan/old_injuries.csv)" -gt 1 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Headless Claude Code, not the GitHub app: it needs only the API key.
      # Tools are limited to web research and editing the one list, with no
      # shell, so a hostile web page cannot reach the keys or other files.
      - name: Research and update the list
        id: research
        if: steps.scan.outputs.changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEEK: ${{ steps.scan.outputs.week }}
        run: |
          npm install -g @anthropic-ai/claude-code
          cp fantasy-data/fantasyfb/injured_list.csv injured_list.before.csv
          sed -e "s/{WEEK_PLUS_3}/$((WEEK + 3))/g" -e "s/{WEEK}/$WEEK/g" .github/prompts/sfb-injuries.md > prompt.md
          # Only Edit(path) rules are path-checked; Write(path) matches nothing.
          # The summary is Claude's final message, so no second file is needed.
          claude -p "$(cat prompt.md)" --max-turns 60 \
            --allowedTools "WebSearch" "WebFetch" "Read" \
              "Edit(fantasy-data/fantasyfb/injured_list.csv)" | tee scan/summary.md

      - name: Validate the edited list
        if: steps.scan.outputs.changes == 'true'
        run: sfb-field check-injuries injured_list.before.csv fantasy-data/fantasyfb/injured_list.csv

      # A dry run stops here: the proposed change goes to the run's summary
      # page instead of fantasy-data, and the refresh below is skipped.
      - name: Show the proposed change (dry run)
        if: steps.scan.outputs.changes == 'true' && inputs.dry_run
        run: |
          {
            echo "## Proposed injured_list.csv changes (dry run, nothing committed)"
            echo '```diff'
            diff -u injured_list.before.csv fantasy-data/fantasyfb/injured_list.csv || true
            echo '```'
            echo
            cat scan/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the update
        if: steps.scan.outputs.changes == 'true' && !inputs.dry_run
        run: |
          cd fantasy-data
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update injured list (automated, week ${{ steps.scan.outputs.week }})"
          git push origin HEAD:main

      # raw.githubusercontent.com is cached for a few minutes, and the refresh
      # reads the list from there, so wait until it serves the new file.
      - name: Wait for the new list to be served
        if: steps.scan.outputs.changes == 'true' && !inputs.dry_run
        run: |
          want=$(sha256sum fantasy-data/fantasyfb/injured_list.csv | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -fsS https://raw.githubusercontent.com/tefirman/fantasy-data/main/fantasyfb/injured_list.csv | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && exit 0
            sleep 30
          done
          echo "The new list was not being served after 10 minutes; the refresh may use the old one." >&2

  refresh:
    name: Collect, simulate, publish
    needs: injuries
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The default GITHUB_TOKEN can't push to another repo, so this takes a
      # fine-grained PAT with Contents: write on tefirman/sfb-odds only.
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          repository: tefirman/sfb-odds
          token: ${{ secrets.SFB_ODDS_PUSH_TOKEN }}
          path: site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # Sleeper asks callers to pull its full player list once or twice a day.
      # A fresh runner has no cache, so keep the file per UTC day: a manual
      # re-run on the same day reuses it instead of asking again.
      - name: Get today's date
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Sleeper's player list
        uses: actions/cache@v4
        with:
          path: ~/.cache/fantasyfb/sleeper_players.json
          key: sleeper-players-${{ steps.day.outputs.day }}

      - name: Collect the Sleeper leagues
        shell: bash
        run: sfb-field collect site/inputs/leagues.csv --out-dir sfb/data 2>&1 | tee collect.log
        continue-on-error: true
        id: collect

      # Failed leagues are listed as "FAILED <id>: <error>". Retry just those
      # once, and stop if any still fail, so a partial page is never published.
      - name: Retry failed leagues once
        if: steps.collect.outcome == 'failure'
        shell: bash
        run: |
          if grep -q "429 Client Error\|Too Many Requests" collect.log; then
            echo "Sleeper rate-limited the run; not retrying." >&2
            exit 1
          fi
          failed=$(grep -oE '^FAILED [0-9]+' collect.log | awk '{print $2}' | paste -sd, -)
          if [ -z "$failed" ]; then
            echo "collect failed without naming any leagues" >&2
            exit 1
          fi
          echo "Retrying: $failed"
          sfb-field collect site/inputs/leagues.csv --out-dir sfb/data --only "$failed"

      - name: Simulate the field
        run: sfb-field simulate sfb/data --out-dir sfb

      # The measurement ID is public but deliberately kept out of the repo, so
      # it comes from the SFB_GA_ID repository variable. Fail rather than
      # silently publish a page without analytics.
      - name: Build the page
        env:
          GA_ID: ${{ vars.SFB_GA_ID }}
        run: |
          if [ -z "$GA_ID" ]; then
            echo "Set the SFB_GA_ID repository variable (Settings > Variables)." >&2
            exit 1
          fi
          python app/sfb_site/build.py --odds sfb/odds.csv --cut-line sfb/cut_line.csv \
            --leaderboard site/inputs/SFB16Leaderboard.html --data sfb/data \
            --players sfb/players.csv --out sfb/index.html --ga-id "$GA_ID"

      - name: Sanity-check the output
        run: |
          python - <<'EOF'
          import pandas as pd
          odds = pd.read_csv("sfb/odds.csv")
          assert len(odds) > 4500, f"only {len(odds)} teams"
          assert not odds.isna().any().any(), "NaN in odds.csv"
          assert abs(odds.win.sum() - 1) < 1e-6, f"win odds sum to {odds.win.sum()}"
          assert "googletagmanager" in open("sfb/index.html", encoding="utf-8").read(), "analytics tag missing"
          print(f"{len(odds)} teams, win sums to {odds.win.sum():.6f}")
          EOF

      - name: Publish
        run: |
          week=$(python -c "import pandas as pd; print(int(pd.read_parquet('sfb/data/settings.parquet').first_week.min()) - 1)")
          cp sfb/index.html site/index.html
          cd site
          if git diff --quiet; then
            echo "Page unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh the odds through week $week (automated)"
          git push origin HEAD:main

      # Tomorrow's injury scan reads these, so a failed refresh doesn't save
      # half-collected files.
      - name: Save the rosters for the next injury scan
        uses: actions/cache/save@v4
        with:
          path: |
            sfb/data/rosters.parquet
            sfb/data/settings.parquet
          key: sfb-rosters-${{ github.run_id }}
